<!DOCTYPE html><html><head><meta charset="utf-8"><title>embed host</title>
<!--
  What itch does, as close as matters.

  The game runs in a fixed size iframe on a page it does not own, and
  every control around it, including the fullscreen button, belongs to
  that page. The attributes are the ones itch actually sets, read off
  the live page on 19 September.
-->
<style>
  body { margin: 0; background: #1b1b22; color: #ddd; font: 14px sans-serif; }
  .game_frame { width: 360px; height: 640px; margin: 16px auto; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
  .bar { text-align: center; padding: 8px; }
  button { font: inherit; padding: 6px 14px; }
</style></head>
<body>
<div class="bar"><button id="outside">a button on the page, not in the game</button></div>
<div class="game_frame" id="wrap">
  <iframe id="game_drop" allowfullscreen="true" allow="autoplay; fullscreen *" src="/game/index.html"></iframe>
</div>
<div class="bar"><button id="fs">fullscreen</button></div>
<script>
  document.getElementById('fs').onclick = function () {
    var f = document.getElementById('game_drop');
    (f.requestFullscreen || f.webkitRequestFullscreen).call(f);
  };
</script>
</body></html>
